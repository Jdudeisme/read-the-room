[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "read-the-room"
version = "0.1.0"
description = "Ambient room-sensing engine: loudness, speech, and emotion from live audio."
readme = "README.md"
# Pinned to 3.12: the original demo target (2019 Intel MacBook Pro) was capped
# at torch 2.2.2, whose last Intel-macOS wheels are cp312. That Mac was retired
# 2026-09-30 and JPad (Windows) is the only target, so the macOS reason no
# longer binds. The pins below stay until lifting them is its own
# evidence-gated change on JPad (benchmark regression row + the 2026-07-15
# gate-WAV replay), because every gate row and replay so far ran on them.
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    # torch 2.2.x is the last release with Intel-macOS wheels. It was held
    # the same on both platforms so MacBook benchmarks stayed representative.
    # Historical since the Mac's retirement; see the requires-python note.
    "torch>=2.2.2,<2.3",
    "torchaudio>=2.2.2,<2.3",
    # torch 2.2 predates numpy 2.0 and crashes against it.
    "numpy>=1.26,<2",
    "transformers>=4.40,<4.50",
    "silero-vad>=5.1",
    # ECAPA-TDNN speaker embeddings for the M2 headcount layer. 1.1.0 moved
    # to torch's unified amp API (torch.amp.custom_fwd with device_type=),
    # which doesn't exist in the 2.2.x line torch is pinned to; 1.0.x
    # still uses torch.cuda.amp.custom_fwd, which does. Stay <1.1.
    "speechbrain>=1.0,<1.1",
    "sounddevice>=0.4.6",
    "python-dotenv>=1.0",
    # Uses the OS certificate store for model downloads; needed behind
    # TLS-intercepting proxies/AV where certifi's bundle fails.
    "truststore>=0.9",
    # M3 dashboard: FastAPI app + websocket, served by uvicorn. Plain
    # uvicorn has no websocket protocol implementation — the explicit
    # websockets dep is required for /ws to accept upgrades.
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "websockets>=12,<16",
    # M4 Spotify provider: control-plane HTTP only. Raw httpx over the six
    # endpoints we use instead of spotipy — PKCE needs no client secret,
    # and spotipy's added surface wraps endpoints (recommendations, audio
    # features) that are deprecated for new apps and that selection
    # deliberately does not build on. Also backs the test suite's
    # MockTransport fakes (no network in tests).
    "httpx>=0.27",
]

[project.optional-dependencies]
# httpx backs FastAPI/Starlette's TestClient (websocket + HTTP smoke tests).
# httpx2 (Pydantic's httpx successor, github.com/pydantic/httpx2) is what
# starlette.testclient imports first. Without it, starlette falls back to
# httpx and warns: "Using `httpx` with `starlette.testclient` is
# deprecated; install `httpx2` instead." Nothing breaks today: M8-10's
# fresh-venv run on JPad (2026-10-09; starlette 1.7.0, fastapi 0.143.0)
# passed the full suite both with and without it. It stays so the fallback's
# eventual removal doesn't break the tests. Runtime code uses httpx only.
dev = ["pytest>=8", "httpx>=0.27", "httpx2"]

[project.scripts]
read-the-room = "sensing.__main__:main"
read-the-room-dashboard = "dashboard.__main__:main"
read-the-room-spotify-auth = "playback.spotify_auth:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dashboard = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
